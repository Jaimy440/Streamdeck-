<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PC-Deck">
<meta name="theme-color" content="#1c1c1e">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>PC-Deck</title>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="brand-name">PC-Deck</span>
    <span class="brand-page" id="pageName">Steuerung</span>
  </div>
  <div class="top-tools">
    <input class="top-search" id="spSearch" type="search" placeholder="Playlist suchen" autocomplete="off" hidden>
    <button class="tool" id="spReload" aria-label="Playlists neu laden" hidden><i data-icon="sync"></i></button>
    <button class="tool" id="spLogout" aria-label="Spotify abmelden" hidden><i data-icon="logout"></i></button>
    <button class="tool" id="discordReset" aria-label="Discord-Anzeige zurücksetzen"><i data-icon="sync"></i></button>
    <span class="status off" id="status"><span class="dot"></span><span id="statusText">Getrennt</span></span>
  </div>
</header>

<main class="stage" id="stage">
  <section class="page" id="page-control"><div class="deck" id="deckControl"></div></section>
  <section class="page" id="page-spotify" hidden><div class="deck" id="deckSpotify"></div></section>
  <section class="page" id="page-chrome" hidden><div class="deck" id="deckChrome"></div></section>
  <section class="page" id="page-setup" hidden>
    <div class="panel">
      <i data-icon="link" class="panel-icon"></i>
      <h2>Mit deinem PC verbinden</h2>
      <p>Starte <b>PC-Deck</b> am PC und scanne den QR-Code mit der iPhone-Kamera.<br>
      Danach in Safari: <b>Teilen → Zum Home-Bildschirm</b>.</p>
    </div>
  </section>
</main>

<nav class="pager" id="pager">
  <button data-page="control"><i data-icon="sliders"></i><span>Steuerung</span></button>
  <button data-page="spotify"><i data-icon="music"></i><span>Spotify</span></button>
  <button data-page="chrome"><i data-icon="globe"></i><span>Chrome</span></button>
</nav>

<!-- Eingabe für Webseiten -->
<div class="sheet-bg" id="sheet" hidden>
  <form class="sheet" id="urlForm">
    <div class="sheet-title">Webseite in neuem Tab öffnen</div>
    <div class="sheet-row">
      <input id="urlInput" type="text" inputmode="url" enterkeyhint="go" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="youtube.com oder Suchbegriff">
      <button type="submit" class="sheet-go">Öffnen</button>
    </div>
    <button type="button" class="sheet-cancel" id="urlCancel">Abbrechen</button>
  </form>
</div>

<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
