<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PC-Deck">
<meta name="theme-color" content="#1c1c1e">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>PC-Deck</title>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="brand-name">PC-Deck</span>
    <span class="brand-page" id="pageName"></span>
    <span class="edit-chip" id="editChip" hidden>Bearbeiten</span>
  </div>
  <div class="top-tools">
    <input class="top-search" id="spSearch" type="search" placeholder="Playlist suchen" autocomplete="off" hidden>
    <button class="tool" id="spReload" aria-label="Playlists neu laden" hidden><i data-icon="sync"></i></button>
    <button class="tool" id="spLogout" aria-label="Spotify abmelden" hidden><i data-icon="logout"></i></button>
    <button class="tool" id="discordReset" aria-label="Discord-Anzeige zurücksetzen" hidden><i data-icon="sync"></i></button>
    <button class="tool" id="pageSettings" aria-label="Seite bearbeiten" hidden><i data-icon="grid"></i></button>
    <button class="tool" id="editBtn" aria-label="Tasten bearbeiten"><i data-icon="pencil"></i></button>
    <button class="done-btn" id="doneBtn" hidden>Fertig</button>
    <span class="status off" id="status"><span class="dot"></span><span id="statusText">Getrennt</span></span>
  </div>
</header>

<main class="stage" id="stage">
  <section class="page" id="deckPage"><div class="deck" id="deck"></div></section>
  <section class="page" id="setupPage" hidden>
    <div class="panel">
      <i data-icon="link" class="panel-icon"></i>
      <h2>Mit deinem PC verbinden</h2>
      <p>Starte <b>PC-Deck</b> am PC und scanne den QR-Code mit der iPhone-Kamera.<br>
      Danach in Safari: <b>Teilen → Zum Home-Bildschirm</b>.</p>
    </div>
  </section>
</main>

<nav class="pager" id="pager"></nav>

<!-- Tasten-Editor -->
<div class="modal" id="editor" hidden>
  <div class="ed">
    <div class="ed-head">
      <button class="ed-cancel" id="edCancel">Abbrechen</button>
      <div class="ed-title" id="edTitle">Taste bearbeiten</div>
      <button class="ed-save" id="edSave">Speichern</button>
    </div>
    <div class="ed-body">
      <div class="ed-col ed-look">
        <div class="ed-preview"><div class="deck mini" id="edPreview"></div></div>
        <label class="field"><span>Name</span>
          <input id="edLabel" maxlength="40" autocomplete="off" placeholder="Beschriftung"></label>
        <div class="field"><span>Farbe</span><div class="swatches" id="edColors"></div></div>
        <div class="field"><span>Symbol</span>
          <div class="icon-grid" id="edIcons"></div>
          <input id="edEmoji" maxlength="8" autocomplete="off" placeholder="… oder ein Emoji eintippen 😀">
        </div>
        <div class="ed-tools">
          <button class="ghost" id="edLeft" aria-label="Nach links"><i data-icon="left"></i></button>
          <button class="ghost" id="edRight" aria-label="Nach rechts"><i data-icon="right"></i></button>
          <select id="edMovePage" aria-label="Auf andere Seite verschieben"></select>
          <button class="ghost danger" id="edDelete"><i data-icon="trash"></i>Löschen</button>
        </div>
      </div>
      <div class="ed-col ed-action">
        <div class="ed-section">Aktion</div>
        <div id="edCurrent" class="ed-current"></div>
        <div id="edParams"></div>
        <div id="edCatalog" class="catalog"></div>
      </div>
    </div>
  </div>
</div>

<!-- Seiten-Editor -->
<div class="modal" id="pageEd" hidden>
  <div class="ed narrow">
    <div class="ed-head">
      <button class="ed-cancel" id="peCancel">Abbrechen</button>
      <div class="ed-title" id="peTitle">Seite bearbeiten</div>
      <button class="ed-save" id="peSave">Speichern</button>
    </div>
    <div class="ed-body single">
      <div class="ed-col">
        <label class="field"><span>Name der Seite</span><input id="peName" maxlength="30" autocomplete="off"></label>
        <div class="field"><span>Symbol</span><div class="icon-grid" id="peIcons"></div></div>
        <div class="ed-tools">
          <button class="ghost" id="peLeft" aria-label="Nach links"><i data-icon="left"></i></button>
          <button class="ghost" id="peRight" aria-label="Nach rechts"><i data-icon="right"></i></button>
          <button class="ghost danger" id="peDelete"><i data-icon="trash"></i>Seite löschen</button>
        </div>
        <button class="ghost wide-btn" id="peReset">Standard-Layout wiederherstellen</button>
      </div>
    </div>
  </div>
</div>

<!-- Eingabe für Webseiten -->
<div class="sheet-bg" id="sheet" hidden>
  <form class="sheet" id="urlForm">
    <div class="sheet-title">Webseite in neuem Tab öffnen</div>
    <div class="sheet-row">
      <input id="urlInput" type="text" inputmode="url" enterkeyhint="go" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="youtube.com oder Suchbegriff">
      <button type="submit" class="sheet-go">Öffnen</button>
    </div>
    <button type="button" class="sheet-cancel" id="urlCancel">Abbrechen</button>
  </form>
</div>

<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
